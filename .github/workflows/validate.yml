name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files and SKILL.md frontmatter
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            SKILL.md \
            README.md \
            AGENTS.md \
            LICENSE \
            examples/env.example \
            examples/debt-profile.example.json \
            references/due-date-inference.md \
            references/payoff-methods.md \
            references/session-due-date-inference.md \
            scripts/install.sh; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

          head -n 1 SKILL.md | grep -qx -- '---'
          grep -q '^name: actual-budget-finance-planner$' SKILL.md
          grep -q '^description: ' SKILL.md
          grep -q '^version: ' SKILL.md
          grep -q '^---$' SKILL.md

          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          files = [
              Path('SKILL.md'),
              Path('README.md'),
              Path('examples/env.example'),
              Path('examples/debt-profile.example.json'),
              Path('references/due-date-inference.md'),
              Path('references/payoff-methods.md'),
              Path('references/session-due-date-inference.md'),
          ]
          patterns = {
              'uuid': re.compile(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'),
              'private_url': re.compile(r'https?://(?:10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[0-1])\.)'),
              'actual_secret_assignment': re.compile(r'ACTUAL_(?:PASSWORD|SYNC_ID|SESSION|TOKEN|API_KEY)\s*=\s*["\']?([^"\'\n#]+)'),
          }
          findings = []
          for path in files:
              text = path.read_text(errors='ignore')
              for name, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      value = match.group(0).lower()
                      allowed = any(token in value for token in ['replace-me', 'example', 'placeholder', '***'])
                      if not allowed:
                          line = text[:match.start()].count('\n') + 1
                          findings.append(f'{path}:{line}: {name}: {match.group(0)[:80]}')
          if findings:
              print('Possible secret or private identifier detected:')
              print('\n'.join(findings))
              sys.exit(1)
          PY

          echo "Validation passed"
